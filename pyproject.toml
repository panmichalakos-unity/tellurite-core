[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tellurite-core"
version = "0.1.0"
description = "Tellurite — Databricks cost audit and optimization tool by Akmonlabs"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Akmonlabs", email = "panmichalakos@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "databricks-sql-connector>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
tellurite-audit = "tellurite.cli:cli"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
